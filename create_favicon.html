<!DOCTYPE html>
<html>
<head>
    <title>가계산 파비콘 생성기</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        .size-group { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>가계산 계산기 파비콘 생성기</h1>
    
    <div class="size-group">
        <h3>16x16 파비콘</h3>
        <canvas id="favicon16" width="16" height="16"></canvas>
        <button onclick="download('favicon16', 'favicon-16x16.png')">다운로드</button>
    </div>
    
    <div class="size-group">
        <h3>32x32 파비콘</h3>
        <canvas id="favicon32" width="32" height="32"></canvas>
        <button onclick="download('favicon32', 'favicon-32x32.png')">다운로드</button>
    </div>
    
    <div class="size-group">
        <h3>192x192 PWA 아이콘</h3>
        <canvas id="logo192" width="192" height="192"></canvas>
        <button onclick="download('logo192', 'logo192.png')">다운로드</button>
    </div>
    
    <div class="size-group">
        <h3>512x512 PWA 아이콘</h3>
        <canvas id="logo512" width="512" height="512"></canvas>
        <button onclick="download('logo512', 'logo512.png')">다운로드</button>
    </div>

    <script>
        // 계산기 아이콘을 그리는 함수
        function drawCalculator(canvas, size) {
            const ctx = canvas.getContext('2d');
            const scale = size / 16; // 16px 기준으로 스케일링
            
            // 배경 초기화
            ctx.clearRect(0, 0, size, size);
            
            // 메인 색상 (가계산 브랜드 컬러)
            const primaryColor = '#81a4cd';
            const darkColor = '#6b8db5';
            const lightColor = '#b3c9e1';
            
            // 계산기 본체 (둥근 모서리 직사각형)
            ctx.fillStyle = primaryColor;
            ctx.beginPath();
            ctx.roundRect(2 * scale, 1 * scale, 12 * scale, 14 * scale, 2 * scale);
            ctx.fill();
            
            // 화면 영역 (상단)
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.roundRect(3 * scale, 2.5 * scale, 10 * scale, 3 * scale, 1 * scale);
            ctx.fill();
            
            // 화면 텍스트 (간단한 숫자)
            ctx.fillStyle = '#00ff00';
            ctx.font = `${Math.max(2, 3 * scale)}px Arial`;
            ctx.textAlign = 'right';
            ctx.fillText('123', 12 * scale, 4.5 * scale);
            
            // 버튼들 (3x4 그리드)
            ctx.fillStyle = lightColor;
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 3; col++) {
                    const x = 3.5 + col * 2.5;
                    const y = 7 + row * 1.8;
                    
                    ctx.beginPath();
                    ctx.roundRect(x * scale, y * scale, 1.8 * scale, 1.3 * scale, 0.3 * scale);
                    ctx.fill();
                }
            }
            
            // 특별한 버튼 색상 (= 버튼)
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.roundRect(9.5 * scale, 13.4 * scale, 1.8 * scale, 1.3 * scale, 0.3 * scale);
            ctx.fill();
            
            // 그림자 효과
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.roundRect(2.5 * scale, 1.5 * scale, 12 * scale, 14 * scale, 2 * scale);
            ctx.fill();
        }
        
        // Canvas에 roundRect 기능 추가 (구형 브라우저 호환)
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
                this.moveTo(x + radius, y);
                this.arcTo(x + width, y, x + width, y + height, radius);
                this.arcTo(x + width, y + height, x, y + height, radius);
                this.arcTo(x, y + height, x, y, radius);
                this.arcTo(x, y, x + width, y, radius);
                this.closePath();
            };
        }
        
        // 각 크기별 아이콘 생성
        drawCalculator(document.getElementById('favicon16'), 16);
        drawCalculator(document.getElementById('favicon32'), 32);
        drawCalculator(document.getElementById('logo192'), 192);
        drawCalculator(document.getElementById('logo512'), 512);
        
        // 다운로드 함수
        function download(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // 페이지 로드 후 자동 다운로드 (선택적)
        setTimeout(() => {
            if (confirm('모든 파비콘을 자동으로 다운로드하시겠습니까?')) {
                download('favicon16', 'favicon-16x16.png');
                setTimeout(() => download('favicon32', 'favicon-32x32.png'), 200);
                setTimeout(() => download('logo192', 'logo192.png'), 400);
                setTimeout(() => download('logo512', 'logo512.png'), 600);
            }
        }, 1000);
    </script>
</body>
</html>
